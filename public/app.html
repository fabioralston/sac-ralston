<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAC Ralston</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="app-header">
  <div class="app-logo">Ralston <span>SAC</span></div>
  <nav class="app-nav">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="chamados">Chamados</button>
    <button data-view="clientes">Clientes</button>
  </nav>
  <div class="app-user">
    <span id="userLabel"></span>
    <button class="btn btn-secondary" id="logoutBtn">Sair</button>
  </div>
</header>

<main class="app-main">

  <!-- DASHBOARD -->
  <section class="view active" id="view-dashboard">
    <div class="view-header"><h1>Dashboard</h1></div>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="charts-grid">
      <div class="card">
        <h3 style="margin-top:0;">Chamados por status</h3>
        <canvas id="chartStatus" height="220"></canvas>
      </div>
      <div class="card">
        <h3 style="margin-top:0;">Chamados por categoria</h3>
        <canvas id="chartCategoria" height="220"></canvas>
      </div>
    </div>
  </section>

  <!-- CHAMADOS -->
  <section class="view" id="view-chamados">
    <div class="view-header">
      <h1>Chamados</h1>
      <button class="btn" id="btnNovoChamado">+ Novo chamado</button>
    </div>
    <div class="card">
      <div class="toolbar">
        <input type="text" id="filtroTexto" placeholder="Buscar por título ou cliente..." style="min-width:220px;" />
        <select id="filtroStatus">
          <option value="">Todos os status</option>
          <option value="aberto">Aberto</option>
          <option value="em_andamento">Em andamento</option>
          <option value="aguardando_cliente">Aguardando cliente</option>
          <option value="resolvido">Resolvido</option>
          <option value="fechado">Fechado</option>
        </select>
        <select id="filtroPrioridade">
          <option value="">Toda prioridade</option>
          <option value="baixa">Baixa</option>
          <option value="media">Média</option>
          <option value="alta">Alta</option>
          <option value="urgente">Urgente</option>
        </select>
      </div>
      <table>
        <thead>
          <tr><th>#</th><th>Título</th><th>Cliente</th><th>Categoria</th><th>Prioridade</th><th>Status</th><th>Aberto em</th></tr>
        </thead>
        <tbody id="chamadosTableBody"></tbody>
      </table>
      <div id="chamadosEmpty" class="empty-state" style="display:none;">Nenhum chamado encontrado.</div>
    </div>
  </section>

  <!-- CLIENTES -->
  <section class="view" id="view-clientes">
    <div class="view-header">
      <h1>Clientes</h1>
      <button class="btn" id="btnNovoCliente">+ Novo cliente</button>
    </div>
    <div class="card">
      <div class="toolbar">
        <input type="text" id="filtroClienteTexto" placeholder="Buscar por nome, e-mail ou telefone..." style="min-width:260px;" />
      </div>
      <table>
        <thead>
          <tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Documento</th><th>Chamados</th></tr>
        </thead>
        <tbody id="clientesTableBody"></tbody>
      </table>
      <div id="clientesEmpty" class="empty-state" style="display:none;">Nenhum cliente cadastrado.</div>
    </div>
  </section>

</main>

<!-- MODAL: Novo/Detalhe Chamado -->
<div class="modal-overlay" id="modalChamado">
  <div class="modal">
    <button class="modal-close" data-close>&times;</button>
    <h2 id="modalChamadoTitle">Novo chamado</h2>
    <form id="formChamado">
      <input type="hidden" id="chamadoId" />
      <div class="field">
        <label for="chamadoTitulo">Título</label>
        <input type="text" id="chamadoTitulo" required />
      </div>
      <div class="field">
        <label for="chamadoCliente">Cliente</label>
        <select id="chamadoCliente" required></select>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="chamadoCategoria">Categoria</label>
          <select id="chamadoCategoria"></select>
        </div>
        <div class="field">
          <label for="chamadoPrioridade">Prioridade</label>
          <select id="chamadoPrioridade">
            <option value="baixa">Baixa</option>
            <option value="media" selected>Média</option>
            <option value="alta">Alta</option>
            <option value="urgente">Urgente</option>
          </select>
        </div>
      </div>
      <div class="field" id="fieldStatus" style="display:none;">
        <label for="chamadoStatus">Status</label>
        <select id="chamadoStatus">
          <option value="aberto">Aberto</option>
          <option value="em_andamento">Em andamento</option>
          <option value="aguardando_cliente">Aguardando cliente</option>
          <option value="resolvido">Resolvido</option>
          <option value="fechado">Fechado</option>
        </select>
      </div>
      <div class="field">
        <label for="chamadoDescricao">Descrição</label>
        <textarea id="chamadoDescricao" rows="3"></textarea>
      </div>
      <button type="submit" class="btn btn-block">Salvar</button>
    </form>

    <div id="interacoesSection" style="display:none;">
      <div class="interacoes-list" id="interacoesList"></div>
      <form id="formInteracao" style="margin-top:12px; display:flex; gap:8px;">
        <input type="text" id="interacaoMensagem" placeholder="Adicionar nota/atualização..." style="flex:1; padding:10px 12px; border:1px solid var(--color-border); border-radius:8px;" />
        <button type="submit" class="btn">Adicionar</button>
      </form>
    </div>
  </div>
</div>

<!-- MODAL: Novo Cliente -->
<div class="modal-overlay" id="modalCliente">
  <div class="modal">
    <button class="modal-close" data-close>&times;</button>
    <h2>Novo cliente</h2>
    <form id="formCliente">
      <div class="field">
        <label for="clienteNome">Nome</label>
        <input type="text" id="clienteNome" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="clienteEmail">E-mail</label>
          <input type="email" id="clienteEmail" />
        </div>
        <div class="field">
          <label for="clienteTelefone">Telefone</label>
          <input type="text" id="clienteTelefone" />
        </div>
      </div>
      <div class="field">
        <label for="clienteDocumento">CPF/CNPJ</label>
        <input type="text" id="clienteDocumento" />
      </div>
      <div class="field">
        <label for="clienteObs">Observações</label>
        <textarea id="clienteObs" rows="2"></textarea>
      </div>
      <button type="submit" class="btn btn-block">Salvar</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/app.js"></script>
</body>
</html>
